<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { width: 360px; margin: 0; padding: 16px; background: #0a0a0a; color: #e5e5e5; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .muted { color: #a1a1aa; font-size: 12px; }
    input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #333; background: #18181b; color: #fff; font-size: 13px; }
    button { width: 100%; padding: 10px; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .primary { background: #4f46e5; color: #fff; }
    .secondary { background: #27272a; color: #fff; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 10px; padding: 12px; margin-top: 12px; }
    .ok { color: #4ade80; }
    .err { color: #f87171; }
    a { color: #60a5fa; word-break: break-all; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    label { font-size: 12px; color: #a1a1aa; display: block; margin: 10px 0 4px; }
    code { font-size: 11px; background: #27272a; padding: 1px 4px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ProPortal → iCal</h1>
  <div class="muted">Detects <code>/ProPortal/pages/ilp/prosolution/26_1/pstimetable.aspx</code> and sends the timetable to your Elysia server.</div>

  <label for="serverUrl">Elysia server URL</label>
  <input id="serverUrl" placeholder="http://localhost:3000" />

  <label for="authToken">Auth token <span class="muted">(RANDOM_IDENTIFER on server)</span></label>
  <input id="authToken" type="password" placeholder="same secret as server .env" />
  <div class="muted" style="margin-top:4px;font-size:11px">Like elt2ical: must match <code>RANDOM_IDENTIFER</code>/<code>AUTH_TOKEN</code> on the server. Prevents others pushing to your iCal.</div>

  <div class="row">
    <button id="save" class="secondary" style="flex:0 0 90px">Save</button>
    <span id="saveStatus" class="muted" style="align-self:center;margin-left:6px"></span>
  </div>

  <button id="scrape" class="primary">Scrape &amp; send now</button>
  <div id="status" class="card muted">Waiting… open the ProPortal timetable page.</div>

  <div id="result" class="card" style="display:none"></div>

  <div style="margin-top:12px;text-align:center">
    <a href="#" id="openOptions" class="muted" style="font-size:11px">open options</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
